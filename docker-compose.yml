services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - dte
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - dte
    restart: unless-stopped

networks:
  dte:
    driver: bridge
