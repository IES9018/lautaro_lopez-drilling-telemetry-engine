name: Security

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  bandit:
    name: bandit-sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Bandit (medium+)
        run: bandit -r src -ll -f txt
