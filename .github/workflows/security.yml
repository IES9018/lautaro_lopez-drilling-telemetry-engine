# SAST — Bandit sobre código Python (RF-12)
name: Security

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - run: bandit -r src/ -ll -q
