[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drilling-telemetry-engine"
version = "0.1.0"
description = "Soft real-time Stick-Slip estimator and drilling digital twin (PP3 IES 9-018)"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "lautaro_lopez" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "fastapi>=0.110",
  "pydantic>=2.6",
  "uvicorn[standard]>=0.27",
  "websockets>=12.0",
  "redis>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "mypy>=1.9",
  "ruff>=0.4",
  "bandit>=1.7",
  "types-redis>=4.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
files = ["src", "tests"]
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
  "--strict-markers",
  "--cov=src",
  "--cov-report=term-missing",
  "--cov-fail-under=85",
]
markers = [
  "property: Hypothesis property-based tests",
  "integration: integration tests",
  "unit: unit tests",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
  "**/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "E501",   # line length — deuda preexistente en engine; format no la rompe
  "UP042",  # StrEnum — StickSlipRegime (str, Enum) intencional en SSI
]

[tool.ruff.format]
quote-style = "double"

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", ".venv", "src/ui"]
